# use docker image with latex preinstalled
# since there is no official latex image, use https://github.com/blang/latex-docker (Base: ubuntu:16.04)
# possible alternative: https://github.com/natlownes/docker-latex (Base: ubuntu:14.04)
image: blang/latex:ctanfull

before_script:
  - apt-get update
  - apt-get --yes install ghostscript

test:
  stage: test
  script:
    - ./test.sh -d issues/github/issue_9.tex -d issues/gitlab/issue_23a.tex -d issues/gitlab/issue_23b.tex -d issues/gitlab/issue_42.tex -d issues/gitlab/issue_49.tex -d issues/gitlab/issue_58.tex -d issues/gitlab/issue_61c.tex -d issues/gitlab/issue_79.tex -d test/babel/french-1.tex -d test/babel/french-2.tex -d test/babel/french-3.tex -d test/babel/french-4.tex -d test/babel/french-5.tex -d test/babel/french-6.tex -d test/caption-light/french-1.tex -d test/keyfloat -d test/thesis -o report.xml
# when: manual
  artifacts:
    reports:
      junit: report.xml
